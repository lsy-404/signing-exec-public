name: macOS signing runner

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Signing request UUID
        required: true
        type: string
      generation:
        description: Positive request generation
        required: true
        type: string
      nonce:
        description: One-time request nonce
        required: true
        type: string

permissions:
  contents: read

jobs:
  signing:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: macos-15
    timeout-minutes: 20
    environment: signing
    env:
      INPUT_REQUEST_ID: ${{ inputs.request_id }}
      INPUT_GENERATION: ${{ inputs.generation }}
      INPUT_NONCE: ${{ inputs.nonce }}
      RUNNER_VISIBILITY: ${{ github.event.repository.private && 'private' || 'public' }}
      SIGNING_RUNNER_TOKEN: ${{ secrets.SIGNING_RUNNER_TOKEN }}
    steps:
      - name: Reject workflow reruns
        if: ${{ github.run_attempt != 1 }}
        run: exit 1

      - name: Checkout exact workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'

      - name: Set up pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.34.6 --activate

      - name: Install runner dependencies
        run: pnpm --dir runner install --frozen-lockfile --ignore-scripts

      - name: Execute signing request
        id: execute
        run: node runner/client.mjs execute

      - name: Upload signed output
        id: artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: signing-${{ inputs.request_id }}-${{ inputs.generation }}
          path: ${{ steps.execute.outputs.output_dir }}/*
          retention-days: 7
          if-no-files-found: error

      - name: Submit signed output receipt
        env:
          INPUT_ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
          INPUT_ARTIFACT_DIGEST: sha256:${{ steps.artifact.outputs.artifact-digest }}
          INPUT_WORK_DIR: ${{ steps.execute.outputs.work_dir }}
        run: node runner/client.mjs complete

      - name: Clean up this request
        if: always() && steps.execute.outputs.work_dir != ''
        env:
          INPUT_WORK_DIR: ${{ steps.execute.outputs.work_dir }}
        run: node runner/client.mjs cleanup
